        font-size="39" font-weight="900" letter-spacing=".3" textLength="286"
        lengthAdjust="spacingAndGlyphs" transform="skewX(-5)"
        filter="url(#rough)" mask="url(#wear)">REPOSITÓRIOS</text>

  <text x="91" y="72" fill="#fff" opacity=".16"
        font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
        font-size="39" font-weight="900" textLength="286" lengthAdjust="spacingAndGlyphs"
        transform="skewX(-5)" filter="url(#halo)">REPOSITÓRIOS</text>

