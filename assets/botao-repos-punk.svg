<svg xmlns="http://www.w3.org/2000/svg" width="400" height="114" viewBox="0 0 400 114" role="img" aria-labelledby="title desc">
  <title id="title">Repositórios</title>
  <desc id="desc">Botão preto e branco com aparência de graffiti, spray e papel rasgado.</desc>
  <defs>
    <filter id="rough" x="-8%" y="-15%" width="116%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .19" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="halo" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="3.2 1.2"/>
    </filter>
    <mask id="wear">
