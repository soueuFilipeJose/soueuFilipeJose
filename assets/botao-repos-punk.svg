      <g fill="#000">
        <circle cx="112" cy="48" r="2.2"/><circle cx="143" cy="63" r="1.7"/>
        <circle cx="177" cy="43" r="2.4"/><circle cx="205" cy="68" r="1.5"/>
        <circle cx="239" cy="51" r="2.1"/><circle cx="278" cy="66" r="2.5"/>
        <circle cx="315" cy="45" r="1.8"/><circle cx="348" cy="60" r="2.1"/>
        <path d="M99 56l21-4v4l-21 4zM153 72l28-5v4l-28 5zM218 41l24-3v3l-24 4zM288 58l33-4v4l-33 5zM334 74l25-4v3l-25 5z"/>
      </g>
    </mask>
  </defs>

  <rect width="400" height="114" fill="#030303"/>
  <g aria-hidden="true" opacity=".22" stroke="#fff" fill="none">
    <path d="M-9 24L51 9L105 20L164 7L222 18L281 5L342 20L409 8" stroke-width="7"/>
