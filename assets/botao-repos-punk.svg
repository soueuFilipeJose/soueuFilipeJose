    <path d="M12 16l34 25M18 42L46 13M354 16l31 27M384 13l-29 33" stroke-width="5" opacity=".75"/>
  </g>

  <g aria-hidden="true" fill="#fff">
    <circle cx="14" cy="66" r="2.8"/><circle cx="26" cy="91" r="1.5"/>
    <circle cx="51" cy="18" r="1.8"/><circle cx="76" cy="96" r="2.5"/>
    <circle cx="92" cy="13" r="1.2"/><circle cx="128" cy="93" r="1.8"/>
    <circle cx="159" cy="15" r="2.2"/><circle cx="191" cy="98" r="1.1"/>
    <circle cx="225" cy="12" r="1.5"/><circle cx="260" cy="96" r="2.3"/>
    <circle cx="301" cy="16" r="1.3"/><circle cx="337" cy="96" r="1.9"/>
