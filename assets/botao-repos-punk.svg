    <path d="M3 17L18 16L24 8L50 10L55 52L5 55Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="bevel"/>
    <path d="M17 27V45M17 35H39M39 29V43" fill="none" stroke="#fff" stroke-width="4"/>
